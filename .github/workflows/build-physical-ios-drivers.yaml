name: Build Physical iOS Drivers

# Builds the pre-built XCTest runner for PHYSICAL iOS devices, one per SDK generation.
# A runner built with Xcode 26 (iOS 26 SDK) crashes at launch on iOS <= 18 (missing XCTest
# symbols like XCTCommandLineToolHelper) and vice-versa, so the fleet needs both:
#   - ios18: built with Xcode 16 (iOS 18 SDK) on macos-15  -> devices up to iOS 18.x
#   - ios26: built with Xcode 26 (iOS 26 SDK) on macos-26  -> devices iOS 26+
# Each job signs with the dev cert + provisioning profile and uploads a deploy zip artifact.
# Download the artifacts and publish them to the distribution server as
#   maestro-iphoneos-driver-build-ios18.zip / -ios26.zip
# The bootstrap (vm scripts/maestro-ios.sh) then picks the right one by the device iOS version.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.variant }} driver
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ios18
            runner: macos-15
            xcode_glob: 'Xcode_16*.app'
          - variant: ios26
            runner: macos-26
            xcode_glob: 'Xcode_26*.app'

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/${{ matrix.xcode_glob }} 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode matching ${{ matrix.xcode_glob }} on this runner:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Put our keychain first in the search list so codesign/find-identity see the cert.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Write provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/realdevices.mobileprovision"

      - name: Build iphoneos runner (signing off; resign step signs it)
        run: |
          set -euo pipefail
          xcodebuild clean build-for-testing \
            -project maestro-ios-xctest-runner/maestro-driver-ios.xcodeproj \
            -scheme maestro-driver-ios \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$HOME/.maestro/maestro-iphoneos-driver-build/driver-iphoneos" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          echo "Build products:"
          ls "$HOME/.maestro/maestro-iphoneos-driver-build/driver-iphoneos/Build/Products/Debug-iphoneos"
          echo "xctestrun:"
          find "$HOME/.maestro/maestro-iphoneos-driver-build/driver-iphoneos/Build/Products" -name '*.xctestrun'

      - name: Re-sign and package (${{ matrix.variant }})
        run: |
          set -euo pipefail
          DRIVER_VARIANT=${{ matrix.variant }} ./maestro-ios-xctest-runner/resign-maestro-ios-runner.sh \
            "$RUNNER_TEMP/realdevices.mobileprovision"
          cp "$HOME/.maestro/maestro-iphoneos-driver-build-${{ matrix.variant }}.zip" "$GITHUB_WORKSPACE/"

      - name: Sanity-check the zip
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/maestro-iphoneos-driver-build-${{ matrix.variant }}.zip"
          echo "xctestrun(s) shipped (must be exactly one, matching the SDK):"
          unzip -l "$ZIP" | grep -iE '\.xctestrun' || (echo "no xctestrun in zip!" && exit 1)

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-iphoneos-driver-build-${{ matrix.variant }}
          path: maestro-iphoneos-driver-build-${{ matrix.variant }}.zip
          if-no-files-found: error
